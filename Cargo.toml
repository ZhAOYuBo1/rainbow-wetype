[package]
name = "rainbow-wetype"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.4"
winreg = "0.56.0"

# Work around environments that block optimized build-script executables.
[profile.release.build-override]
opt-level = 0
